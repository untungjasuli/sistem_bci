# ============================================
# DOCKER COMPOSE - Sistem BCI Production
# Hanya service 'app' (cloudflared & MySQL di host)
# ============================================

version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sistem-bci-app
    restart: unless-stopped
    
    # Bind ke localhost host only (aman, tidak expose ke internet)
    # cloudflared di host forward ke 127.0.0.1:3000
    ports:
      - "127.0.0.1:3000:3000"
    
    environment:
      # App config
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      
      # Database - Host MySQL (bukan container)
      # Docker Desktop (Mac/Win): host.docker.internal
      # Linux native: 172.17.0.1 (bridge gateway)
      - DB_HOST=host.docker.internal
      - DB_PORT=3306
      - DB_USER=victor
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=sistem_bci
      
      # Session
      - SESSION_SECRET=${SESSION_SECRET}
      
      # Trust proxy: FALSE (cloudflared bukan reverse proxy, forward langsung ke localhost)
      - TRUST_PROXY=false
    
    # Resolve host.docker.internal di Linux
    extra_hosts:
      - "host.docker.internal:host-gateway"
    
    # Resource limits
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    
    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# Network internal (optional, untuk isolasi)
networks:
  default:
    name: bci-internal
    driver: bridge
    internal: false  # false biar bisa akses host.docker.internal